name: Verify and optionally deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified build to GitHub Pages (pushes to main always deploy)
        type: boolean
        default: false
      e2e_profile:
        description: Browser test selection (automatic runs always use full)
        type: choice
        options: [full, smoke, selected]
        default: full
      e2e_areas:
        description: Comma-separated areas for selected profile
        type: string
        default: preview
      e2e_checks:
        description: Optional comma-separated checks for selected profile
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Require full browser verification for publishing
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.e2e_profile != 'full'
        run: echo 'Publishing requires the full E2E profile.' >&2; exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:e2e
      - run: npm run e2e:check
      - run: npm run test:coverage
      - run: npm run authoring:check
      - run: npm run extract-i18n
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Full browser regression
        if: github.event_name != 'workflow_dispatch' || inputs.e2e_profile == 'full'
        run: npm run e2e
      - name: Browser smoke
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_profile == 'smoke'
        run: npm run e2e:smoke
      - name: Selected browser areas and checks
        if: github.event_name == 'workflow_dispatch' && inputs.e2e_profile == 'selected'
        env:
          E2E_AREAS: ${{ inputs.e2e_areas }}
          E2E_CHECKS: ${{ inputs.e2e_checks }}
        shell: bash
        run: |
          args=()
          if [[ -n "$E2E_AREAS" ]]; then args+=(--area "$E2E_AREAS"); fi
          if [[ -n "$E2E_CHECKS" ]]; then args+=(--check "$E2E_CHECKS"); fi
          if [[ ${#args[@]} -eq 0 ]]; then echo 'Select at least one area or check.' >&2; exit 1; fi
          node scripts/e2e-run.mjs "${args[@]}"
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            playwright-report/
            test-results/
            reports/e2e/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/studio/browser
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
